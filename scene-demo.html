<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#c9eef2" />
    <title>고양이섬 · 씬 데모</title>
    <style>
      :root { --ink: #5b4636; --card: rgba(255, 252, 245, 0.92); --accent: #ff8f7a; }
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body { margin: 0; height: 100%; overflow: hidden; background: #c9eef2; overscroll-behavior: none; }
      body { font-family: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif; color: var(--ink); user-select: none; -webkit-user-select: none; }
      canvas#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
      .top { position: fixed; top: calc(12px + env(safe-area-inset-top)); left: 12px; right: 12px; display: flex; justify-content: space-between; align-items: flex-start; pointer-events: none; }
      .badge { background: var(--card); border-radius: 999px; padding: 8px 14px; font-weight: 700; font-size: 14px; box-shadow: 0 2px 10px rgba(70, 50, 30, 0.12); }
      .badge small { font-weight: 600; opacity: 0.6; margin-left: 6px; }
      #fps { font-variant-numeric: tabular-nums; font-size: 12px; font-weight: 600; opacity: 0.75; }
      .dock { position: fixed; left: 0; right: 0; bottom: calc(12px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
      .bar { display: flex; gap: 6px; justify-content: center; padding: 0 12px; }
      .chips { display: flex; gap: 6px; overflow-x: auto; padding: 4px 12px; pointer-events: auto; scrollbar-width: none; }
      .chips::-webkit-scrollbar { display: none; }
      .chips button { flex: none; display: inline-flex; align-items: center; gap: 5px; appearance: none; border: 0; cursor: pointer; font: inherit; font-weight: 700; font-size: 12px; color: var(--ink); background: var(--card); border-radius: 999px; padding: 7px 11px; box-shadow: 0 2px 8px rgba(70, 50, 30, 0.14); }
      .chips button i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
      .chips button.on { background: var(--ink); color: #fff; }
      .bar button { pointer-events: auto; appearance: none; border: 0; cursor: pointer; font: inherit; font-weight: 700; font-size: 13px; color: var(--ink); background: var(--card); border-radius: 999px; padding: 11px 13px; box-shadow: 0 3px 12px rgba(70, 50, 30, 0.16); transition: transform 0.12s ease, background 0.2s ease; white-space: nowrap; }
      .bar button:active { transform: scale(0.94); }
      .bar button.on { background: var(--accent); color: #fff; }
      #toast { position: fixed; left: 50%; bottom: calc(118px + env(safe-area-inset-bottom)); transform: translate(-50%, 8px); background: rgba(91, 70, 54, 0.9); color: #fff; font-weight: 700; font-size: 14px; padding: 9px 16px; border-radius: 999px; opacity: 0; transition: opacity 0.2s ease, transform 0.2s ease; pointer-events: none; white-space: nowrap; }
      #toast.show { opacity: 1; transform: translate(-50%, 0); }
      .hint { position: fixed; left: 0; right: 0; top: calc(56px + env(safe-area-inset-top)); text-align: center; font-size: 12px; font-weight: 600; color: rgba(91, 70, 54, 0.7); pointer-events: none; text-shadow: 0 1px 0 rgba(255, 255, 255, 0.6); animation: hint 7s ease forwards; }
      @keyframes hint { 0%, 70% { opacity: 1; } 100% { opacity: 0; } }
    </style>
  </head>
  <body>
    <canvas id="scene"></canvas>
    <div class="top">
      <div class="badge">고양이섬<small>씬 데모</small></div>
      <div class="badge" id="fps">– fps</div>
    </div>
    <div class="hint">드래그로 이동 · 두 손가락으로 확대 · 집이나 고양이를 눌러 보세요</div>
    <div id="toast"></div>
    <div class="dock">
      <div id="regions" class="chips" aria-label="지역 강조"></div>
      <div class="bar">
        <button id="btn-time">밤으로</button>
        <button id="btn-count">집 100채</button>
        <button id="btn-find">아무 집 가기</button>
        <button id="btn-top">특이한 집</button>
      </div>
    </div>
    <script type="module" src="/src/scene/demo/main.ts"></script>
  </body>
</html>
