<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#c9eef2" />
    <title>고양이섬 씬 데모</title>
    <!--demo-style-->
    <style>
      /* 화면 전체가 3D 캔버스이고, 그 위에 확인용 둥근 버튼만 떠 있는 한 화면짜리 데모 */
      :root {
        --sea: #c9eef2;
        --ink: #5b4636;
        --ink-soft: rgba(91, 70, 54, 0.72);
        --card: rgba(255, 252, 245, 0.93);
        --accent: #ff8f7a;
        --on-dark: #ffffff;
        --toast: rgba(91, 70, 54, 0.92);
        --shadow: rgba(70, 50, 30, 0.16);
        --gutter-l: max(16px, env(safe-area-inset-left, 0px));
        --gutter-r: max(16px, env(safe-area-inset-right, 0px));
        --font: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
        color-scheme: light;
      }
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; }
      body { background: var(--sea); color: var(--ink); font-family: var(--font); user-select: none; -webkit-user-select: none; }
      canvas#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
      .top { position: fixed; top: 0; left: 0; right: 0; display: flex; gap: 8px; justify-content: space-between; align-items: flex-start; pointer-events: none; padding-top: calc(12px + env(safe-area-inset-top, 0px)); padding-left: var(--gutter-l); padding-right: var(--gutter-r); }
      .badge { background: var(--card); border-radius: 999px; padding: 8px 14px; font-weight: 700; font-size: 14px; box-shadow: 0 2px 10px var(--shadow); white-space: nowrap; }
      .badge small { font-weight: 600; opacity: 0.6; margin-left: 6px; }
      #fps { font-variant-numeric: tabular-nums; font-size: 11px; font-weight: 600; opacity: 0.8; padding: 7px 11px; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
      .hint { position: fixed; left: 0; right: 0; top: calc(54px + env(safe-area-inset-top, 0px)); text-align: center; font-size: 12px; font-weight: 600; color: var(--ink-soft); pointer-events: none; padding-left: var(--gutter-l); padding-right: var(--gutter-r); animation: hint 8s ease forwards; }
      @keyframes hint { 0%, 70% { opacity: 1; } 100% { opacity: 0; } }
      .dock { position: fixed; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; gap: 6px; pointer-events: none; padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px)); }
      .bar { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; padding-left: var(--gutter-l); padding-right: var(--gutter-r); }
      .bar button, .chips button { appearance: none; border: 0; cursor: pointer; font: inherit; font-weight: 700; color: var(--ink); background: var(--card); border-radius: 999px; white-space: nowrap; pointer-events: auto; transition: transform 0.12s ease, background 0.2s ease; }
      .bar button { font-size: 13px; padding: 11px 13px; box-shadow: 0 3px 12px var(--shadow); }
      .bar button:active, .chips button:active { transform: scale(0.94); }
      .bar button:focus-visible, .chips button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
      .chips { display: flex; gap: 6px; overflow-x: auto; padding-block: 4px; padding-left: var(--gutter-l); padding-right: var(--gutter-r); pointer-events: auto; scrollbar-width: none; }
      .chips::-webkit-scrollbar { display: none; }
      .chips button { flex: none; display: inline-flex; align-items: center; gap: 5px; font-size: 12px; padding: 7px 11px; box-shadow: 0 2px 8px var(--shadow); }
      .chips button i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
      .chips button.on { background: var(--ink); color: var(--on-dark); }
      #toast { position: fixed; left: 50%; bottom: calc(112px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 8px); max-width: calc(100% - 32px); overflow: hidden; text-overflow: ellipsis; background: var(--toast); color: var(--on-dark); font-weight: 700; font-size: 13px; padding: 9px 16px; border-radius: 999px; opacity: 0; transition: opacity 0.2s ease, transform 0.2s ease; pointer-events: none; white-space: nowrap; }
      #toast.show { opacity: 1; transform: translate(-50%, 0); }
      /* 걷기 모드: 조이스틱 자리를 비우려고 "걷기 끝" 버튼만 위쪽에 남긴다 */
      body.walking #regions, body.walking .bar button:not(#btn-walk), body.walking .hint { display: none; }
      body.walking .dock { bottom: auto; top: calc(58px + env(safe-area-inset-top, 0px)); padding-bottom: 0; }
      body.walking .bar { justify-content: flex-end; }
      #visit { position: fixed; left: 50%; bottom: calc(190px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 6; appearance: none; border: 0; cursor: pointer; font: inherit; font-weight: 700; font-size: 14px; color: var(--on-dark); background: var(--accent); border-radius: 999px; padding: 12px 20px; box-shadow: 0 4px 14px var(--shadow); white-space: nowrap; }
      #visit[hidden] { display: none; }
      @media (prefers-reduced-motion: reduce) { .bar button, .chips button, #toast { transition: none; } .hint { animation: none; } }
    </style>
    <!--/demo-style-->
  </head>
  <body>
    <!--demo-body-->
    <canvas id="scene"></canvas>
    <div class="top">
      <div class="badge">고양이섬<small>씬 데모</small></div>
      <div class="badge" id="fps">– fps</div>
    </div>
    <div class="hint">드래그로 이동 · 두 손가락으로 확대 · 집이나 고양이를 눌러 보세요</div>
    <div id="toast"></div>
    <button id="visit" hidden>구경하기</button>
    <div class="dock">
      <div id="regions" class="chips" aria-label="지역 강조"></div>
      <div class="bar">
        <button id="btn-time">밤으로</button>
        <button id="btn-count">집 100채</button>
        <button id="btn-find">아무 집 가기</button>
        <button id="btn-top">특이한 집</button>
        <button id="btn-walk">걷기</button>
      </div>
    </div>
    <!--/demo-body-->
    <script type="module" src="/src/scene/demo/main.ts"></script>
  </body>
</html>
